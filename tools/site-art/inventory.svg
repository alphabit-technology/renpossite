<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dish recipe takes its ingredients out of stock when the register closes, and a report compares expected and counted use" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="10" y="10" width="190" height="250" rx="14" class="card"/>
<text x="26" y="38" class="xs mut">Recipe</text><text x="26" y="58" class="lg">Smash burger</text>
<line x1="22" y1="72" x2="188" y2="72" class="hair"/>
<text x="26" y="96" class="sm">Brioche bun</text><text x="186" y="96" class="sm b" text-anchor="end">1</text>
<text x="26" y="126" class="sm">Beef patty</text><text x="186" y="126" class="sm b" text-anchor="end">2 × 100 g</text>
<text x="26" y="156" class="sm">Cheddar</text><text x="186" y="156" class="sm b" text-anchor="end">2 slices</text>
<text x="26" y="186" class="sm">Pickles</text><text x="186" y="186" class="sm b" text-anchor="end">15 g</text>
<text x="26" y="216" class="sm">House sauce</text><text x="186" y="216" class="sm b" text-anchor="end">20 ml</text>
<path d="M206 135h22" class="dash"/><path d="M224 129l8 6-8 6" class="line"/>
<rect x="236" y="10" width="190" height="250" rx="14" class="card"/>
<text x="252" y="38" class="xs mut">Register close · Friday</text><text x="252" y="58" class="lg">128 burgers</text>
<line x1="248" y1="72" x2="414" y2="72" class="hair"/>
<text x="252" y="96" class="xs b">Stock out</text>
<text x="252" y="122" class="sm">Brioche bun</text><text x="412" y="122" class="sm b" text-anchor="end">−128</text>
<text x="252" y="150" class="sm">Beef</text><text x="412" y="150" class="sm b" text-anchor="end">−25.6 kg</text>
<text x="252" y="178" class="sm">Cheddar</text><text x="412" y="178" class="sm b" text-anchor="end">−256</text>
<text x="252" y="206" class="sm">Pickles</text><text x="412" y="206" class="sm b" text-anchor="end">−1.9 kg</text>
<rect x="250" y="226" width="162" height="22" rx="7" class="pri-bg"/><text x="331" y="241" class="xs b pri-t" text-anchor="middle">Stock entry posted</text>
<path d="M432 135h22" class="dash"/><path d="M450 129l8 6-8 6" class="line"/>
<rect x="462" y="10" width="168" height="250" rx="14" class="card"/>
<text x="478" y="38" class="xs mut">Usage variance</text><text x="478" y="58" class="lg">Beef</text>
<line x1="474" y1="72" x2="618" y2="72" class="hair"/>
<text x="478" y="98" class="xs mut">Expected</text><text x="614" y="98" class="sm b" text-anchor="end">25.6 kg</text>
<rect x="478" y="106" width="120" height="8" rx="4" class="pri"/>
<text x="478" y="138" class="xs mut">Counted</text><text x="614" y="138" class="sm b" text-anchor="end">26.4 kg</text>
<rect x="478" y="146" width="124" height="8" rx="4" class="amber-f"/>
<rect x="476" y="176" width="140" height="64" rx="10" class="amber"/>
<text x="490" y="202" class="lg amber-t">+3.1%</text><text x="490" y="222" class="xs mut">more than the recipes</text>
</svg>